name: Release DXN1-OS

# Triggered when a version tag (v*) is pushed. Publishes a GitHub Release
# with the prebuilt ISO + source ZIP + checksums attached.
# Uses the built-in GITHUB_TOKEN (no extra secrets needed).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify prebuilt artifacts exist
        run: |
          test -f public/dxn1-assets/dxn1-os-1.0.iso || { echo "ISO missing"; exit 1; }
          test -f public/dxn1-assets/dxn1-os-source.zip || { echo "source ZIP missing"; exit 1; }
          ls -la public/dxn1-assets/

      - name: Compute checksums
        id: sums
        run: |
          cd public/dxn1-assets
          sha256sum dxn1-os-1.0.iso > dxn1-os-1.0.iso.sha256
          sha256sum dxn1-os-source.zip > dxn1-os-source.zip.sha256
          echo "iso_sha=$(sha256sum dxn1-os-1.0.iso | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "src_sha=$(sha256sum dxn1-os-source.zip | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "--- checksums ---"
          cat dxn1-os-1.0.iso.sha256
          cat dxn1-os-source.zip.sha256

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DXN1-OS ${{ steps.ver.outputs.tag }} 'oxide'
          body: |
            # DXN1-OS ${{ steps.ver.outputs.tag }} 'oxide'

            A **real, bootable minimal Linux** — real Debian 5.10 kernel (EFI_STUB) + real busybox 1.35 static initramfs. UEFI-bootable. Fully installable.

            ## Downloads

            | File | Size | Description |
            |------|------|-------------|
            | `dxn1-os-1.0.iso` | 15.3 MiB | Real bootable UEFI live ISO |
            | `dxn1-os-source.zip` | 91 KB | Full source tree (installer + updater + LFS scripts) |

            ## Verify

            ```bash
            echo "${{ steps.sums.outputs.iso_sha }}  dxn1-os-1.0.iso" | sha256sum -c
            # dxn1-os-1.0.iso: OK
            ```

            ## Install

            1. Flash ISO to USB: `sudo dd if=dxn1-os-1.0.iso of=/dev/sdX bs=4M conv=fsync`
            2. Boot from USB (UEFI mode)
            3. Choose "Install DXN1-OS" from the boot menu
            4. Pick: auto-5GB / full-disk-wipe / manual partition
            5. Run `dxn1-update` after boot to stay current

            ## What's inside the ISO

            - `/boot/bzImage` — real Linux 5.10 kernel (Debian LTS, 7 MB, EFI_STUB)
            - `/boot/initramfs.img` — real busybox 1.35 initramfs (711 KB, 358 entries)
            - `/EFI/BOOT/BOOTX64.EFI` — kernel as EFI app (UEFI boots it directly, no bootloader)
            - `/boot.cat` — El Torito boot catalog
            - `/init` — boot menu (Live / Install / Update / Reboot)
            - `/sbin/dxn1-installer` — real installer (auto-5gb / full-wipe / manual)
            - `/sbin/dxn1-update` — auto-updater (GitHub releases + sha256)
          files: |
            public/dxn1-assets/dxn1-os-1.0.iso
            public/dxn1-assets/dxn1-os-1.0.iso.sha256
            public/dxn1-assets/dxn1-os-source.zip
            public/dxn1-assets/dxn1-os-source.zip.sha256
            public/dxn1-assets/manifest.json
          draft: false
          prerelease: false
